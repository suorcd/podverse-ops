# Version: 1
# Application manifest for Podverse Alpha
# UPDATE: Added 'recurse: true' to include manifests in subdirectories (api, db, mq, etc.)

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podverse-alpha
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/suorcd/podverse-ops.git
    targetRevision: feature/k3s01
    path: k8s/alpha
    
    # REQUIRED: Tells ArgoCD to look inside subfolders (api/, db/, etc.)
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    # We deploy into the namespace we defined in 00-namespace.yaml
    namespace: podverse-alpha
  
  # Sync Policy: Automatically fix drift (Self-Healing)
  syncPolicy:
    automated:
      prune: true    # Delete resources that are removed from Git
      selfHeal: true # Fix resources that are changed manually on the cluster
    syncOptions:
      - CreateNamespace=true # Ensures the namespace exists if 00-namespace.yaml fails