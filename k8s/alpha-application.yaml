# Version: 2
# Root Application (App of Apps Pattern)
# UPDATE: Changed path to 'k8s/alpha/apps' to load child applications.
# Recursive is not strictly needed here if all child apps are in the root of 'apps/', 
# but 'recurse: true' is safe to keep.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podverse-alpha
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: podverse
  source:
    repoURL: https://github.com/suorcd/podverse-ops.git
    targetRevision: feature/k3s01
    
    # POINT TO THE APPS DIRECTORY
    path: k8s/alpha/apps
    
    directory:
      recurse: true
      
  destination:
    server: https://kubernetes.default.svc
    namespace: podverse-alpha
  
  # Sync Policy for the Root App
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
