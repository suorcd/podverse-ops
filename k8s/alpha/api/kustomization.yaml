# Version: 1
# Filename: kustomization.yaml
# Description: Bundles resources and manages image versions for the API.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 1. Resources to include
resources:
  - 01-configmap.yaml
  - 02-service.yaml
  - 03-deployment.yaml

# 2. Namespace (optional, ensures all resources are in this namespace)
namespace: podverse-alpha

# 3. Image Variables
# We define the specific version here.
images:
  - name: ghcr.io/podverse/podverse-api/podverse-api
    newTag: "5.1.13-alpha.1"
