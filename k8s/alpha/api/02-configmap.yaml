# Version: 2
# Non-sensitive configuration for the Podverse API.
# Mapped from config/podverse-api.env.example
# UPDATE: Added MESSAGE_QUEUE_HOST and MESSAGE_QUEUE_PORT to connect to the MQ Service.

apiVersion: v1
kind: ConfigMap
metadata:
  name: podverse-api-config
  namespace: podverse-alpha
  labels:
    app: podverse-api
    environment: alpha
data:
  # General
  NODE_ENV: "development"
  LOG_LEVEL: "info"
  API_PORT: "1234"
  API_PREFIX: "/api"
  API_VERSION: "/v2"

  API_ALLOWED_CORS_ORIGINS: "http://localhost:3000,https://api-alpha-podverse.k.ser.ink,https://alpha-podverse.k.ser.ink,https://k.ser.ink"

  # in secrets
  #AUTH_JWT_SECRET: "your-secret-whatever"

  USER_AGENT: "Ser-Podverse/API-2"
  
  # Use the public facing domain, not the internal docker network ip address.
  COOKIE_DOMAIN: ".k.ser.ink" # prefix with a dot for subdomains, e.g. .podverse.fm or .beta.podverse.fm

  # Web App TODO: Update these to your actual web app domain and protocol
  WEB_PROTOCOL: "http"
  WEB_DOMAIN: "podverse-web:3000"

  # Networking
  # We point to the internal Kubernetes Service for the database
  DB_HOST: "podverse-db"
  DB_PORT: "5432"
  # DB_READ_USERNAME: "read"
  # DB_PASSWORD: "your-db-password"
  # DB_READ_WRITE_USERNAME: "read_write"
  # DB_READ_WRITE_PASSWORD: "read_write"
  # DB_DATABASE: "postgres"
  DB_SSL_CONNECTION: "false"

  #####
  ##### Auth/Membership
  #####

  EMAIL_VERIFICATION_TOKEN_EXPIRATION: "31540000"
  EMAIL_CHANGE_VERIFICATION_TOKEN_EXPIRATION: "31540000"
  RESET_PASSWORD_TOKEN_EXPIRATION: "86400"
  FREE_TRIAL_EXPIRATION: "2592000"
  PREMIUM_MEMBERSHIP_EXPIRATION: "31540000"
  PREMIUM_MEMBERSHIP_COST: "5"
  RESET_PASSWORD_PAGE_PATH: "/reset-password?token="
  VERIFY_EMAIL_PAGE_PATH: "/verify-email?token="
  EMAIL_CHANGE_VERIFICATION_PAGE_PATH: "/email-change-verifying?token="

  # Public Domains (You will configure these in your Ingress later)
  WEBSITE_PROTOCOL: "https"
  WEBSITE_DOMAIN: "api-alpha-podverse.k.ser.ink" # Change to your actual domain

  #####
  ##### Email template
  #####
  ### These are used in the templates of the auth related emails we send.

  EMAIL_BRAND_COLOR: "#2968B1"
  EMAIL_HEADER_IMAGE_URL: ""
  LEGAL_NAME: ""
  LEGAL_ADDRESS: ""
  SOCIAL_FACEBOOK_IMAGE_URL: ""
  SOCIAL_FACEBOOK_PAGE_URL: ""
  SOCIAL_GITHUB_IMAGE_URL: ""
  SOCIAL_GITHUB_PAGE_URL: ""
  SOCIAL_TWITTER_IMAGE_URL: ""
  SOCIAL_TWITTER_PAGE_URL: ""

  #####
  ##### Mailer
  #####

  MAILER_DISABLED: "1"
  MAILER_HOST: ""
  MAILER_PORT: ""
  MAILER_SERVICE: ""
  MAILER_USERNAME: ""
  MAILER_PASSWORD: ""
  MAILER_FROM: ""

  #####
  ##### Podcast Index
  #####

  PODCAST_INDEX_BASE_URL: "api.podcastindex.org"
  #PODCAST_INDEX_AUTH_KEY: ""
  #PODCAST_INDEX_SECRET_KEY: ""

  #####
  ##### Message Queue
  #####

  MESSAGE_QUEUE_HOST: "podverse-mq" # change to service name in production
  MESSAGE_QUEUE_PORT: "5672"
  #MESSAGE_QUEUE_USERNAME: "user"
  #MESSAGE_QUEUE_PASSWORD: "mysecretpw"
