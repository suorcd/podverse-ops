# Version: 4
# The Deployment for the Podverse API.
# It connects to the Database and MQ using the environment variables defined in the ConfigMap/Secret.
# FIX: Added secretRef for podverse-alpha-mq-opaque to resolve Artemis authentication error.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: podverse-api
  namespace: podverse-alpha
  annotations:
    # ArgoCD Application endpoint annotation for clickable link
    argocd.argoproj.io/refresh: "hard"
    argocd.argoproj.io/managed-by: "argocd"
    argocd.argoproj.io/compare-options: "IgnoreExtraneous"
    # This is the endpoint that will show up as a clickable link in ArgoCD UI
    link.argocd.argoproj.io/external-link: https://api-alpha-podverse.k.ser.ink/
  labels:
    app: podverse-api
    environment: alpha
spec:
  # replicas: 1
  selector:
    matchLabels:
      app: podverse-api
  template:
    metadata:
      labels:
        app: podverse-api
        environment: alpha
    spec:
      containers:
      - name: api
        # UPDATE THIS TAG to your desired version (e.g., v4.x.x)
        image: ghcr.io/podverse/podverse-api/podverse-api:5.1.11-alpha.0
        command: ["npm", "start"]
        ports:
        - containerPort: 1234
          name: http
        
        # Container security hardening
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          # TODO: The following caused the error "container has runAsNonRoot and image will run as root"
          # The container image currently runs as UID 0. Once the image is updated to run as a non-root
          # user we should re-enable this. For now it's commented out to allow deployment.
          # runAsNonRoot: true

        # Resource requests and limits
        resources:
          requests:
            memory: "192Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        # Load non-sensitive config
        envFrom:
        - configMapRef:
            name: podverse-api-config
        # Load API specific secrets (JWT, Mailer)
        - secretRef:
            name: podverse-alpha-api-opaque
        # Load DB secrets (DB_READ_PASSWORD, etc.)
        - secretRef:
            name: podverse-alpha-db-opaque
        # Load MQ secrets (MESSAGE_QUEUE_USERNAME, MESSAGE_QUEUE_PASSWORD)
        - secretRef:
            name: podverse-alpha-mq-opaque
        - secretRef:
            name: podverse-alpha-workers-opaque           
        # Basic health check
        readinessProbe:
          httpGet:
            path: /
            port: 1234
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 1234
          initialDelaySeconds: 30
          periodSeconds: 20