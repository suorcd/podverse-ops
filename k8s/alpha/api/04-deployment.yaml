# Version: 3
# The Deployment for the Podverse API.
# It connects to the Database and MQ using the environment variables defined in the ConfigMap/Secret.
# FIX: Corrected indentation for envFrom.secretRef.name.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: podverse-api
  namespace: podverse-alpha
  annotations:
    # ArgoCD Application endpoint annotation for clickable link
    argocd.argoproj.io/refresh: "hard"
    argocd.argoproj.io/managed-by: "argocd"
    argocd.argoproj.io/compare-options: "IgnoreExtraneous"
    # This is the endpoint that will show up as a clickable link in ArgoCD UI
    link.argocd.argoproj.io/external-link: https://api-alpha-podverse.k.ser.ink/
  labels:
    app: podverse-api
    environment: alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podverse-api
  template:
    metadata:
      labels:
        app: podverse-api
        environment: alpha
    spec:
      containers:
      - name: api
        # UPDATE THIS TAG to your desired version (e.g., v4.x.x)
        image: ghcr.io/podverse/podverse-api/podverse-api:5.1.8-alpha.0
        command: ["npm", "start"]
        ports:
        - containerPort: 1234
          name: http
        
        # Load non-sensitive config
        envFrom:
        - configMapRef:
            name: podverse-api-config
        # Load API specific secrets (JWT, Mailer)
        - secretRef:
            name: podverse-alpha-api-opaque
        # Load DB secrets (DB_READ_PASSWORD, etc.)
        - secretRef:
            name: podverse-alpha-db-opaque
            
        # Basic health check
        readinessProbe:
          httpGet:
            path: /
            port: 1234
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 1234
          initialDelaySeconds: 30
          periodSeconds: 20