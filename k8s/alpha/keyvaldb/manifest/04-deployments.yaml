# Version: 2
# Filename: 04-valkey-deployments.yaml
# Description: Deployments for Valkey DB and RedisInsight GUI.
# UPDATE: Switched storage to ephemeral (emptyDir).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: podverse-alpha-keyvaldb
  namespace: podverse-alpha
  labels:
    app: valkey
    environment: alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.0.1
          command: ["valkey-server", "--save", "900 1", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          envFrom:
            - secretRef:
                name: podverse-alpha-keyvaldb-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/valkey
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        # EPHEMERAL STORAGE: Data is lost when pod restarts
        - name: data
          emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podverse-alpha-keyvaldb-gui
  namespace: podverse-alpha
  labels:
    app: valkey-gui
    environment: alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey-gui
  template:
    metadata:
      labels:
        app: valkey-gui
    spec:
      containers:
        - name: gui
          image: redislabs/redisinsight:latest
          ports:
            - containerPort: 5540