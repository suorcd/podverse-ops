# Version: 2
# Pattern: Suspended CronJob (Manual Trigger Only)
# DANGER: Drops the database. Only runs when explicitly triggered.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ops-db-drop-everything
  namespace: podverse-alpha
spec:
  schedule: "* * * * *"
  suspend: true          # <--- CRITICAL SAFETY
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 60
      template:
        spec:
          containers:
          - name: psql
            image: postgres:18.1
            command: ["psql", "-h", "podverse-db", "-U", "postgres", "-d", "postgres", "-c", "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"]
            envFrom:
            - secretRef:
                name: podverse-db-opaque
          restartPolicy: Never