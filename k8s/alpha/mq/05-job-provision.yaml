# Version: 3
# UPDATE: Added writable volume for /var/lib/artemis-instance and explicit bash command.

apiVersion: batch/v1
kind: Job
metadata:
  name: podverse-mq-provisioner
  namespace: podverse-alpha
  labels:
    app: podverse-mq
    component: provisioner
    environment: alpha
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    metadata:
      labels:
        app: podverse-mq-provisioner
    spec:
      restartPolicy: OnFailure
      containers:
      - name: provisioner
        image: apache/activemq-artemis:2.37.0
        # RUN WITH BASH EXPLICITLY to avoid "Permission denied" on the script execution
        command: ["/bin/bash", "/scripts/provision-queues.sh"]
        
        envFrom:
        - secretRef:
            name: podverse-mq-secret
        
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        # MOUNT WRITABLE DIR: The CLI tool needs to write logs/locks here
        - name: scratch-data
          mountPath: /var/lib/artemis-instance
      
      volumes:
      - name: scripts
        configMap:
          name: podverse-mq-scripts
          defaultMode: 0755
      - name: scratch-data
        emptyDir: {}