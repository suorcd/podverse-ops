# Version: 1
# Filename: kustomization.yaml
# Description: Bundles MQ resources and centralizes shared labels + image versions.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 02-configmap.yaml
  - 03-service.yaml
  - 04-statefulset.yaml
  - 05-job-provision.yaml

namespace: podverse-alpha

commonLabels:
  app: podverse-mq
  environment: alpha

images:
  - name: apache/activemq-artemis
    newTag: "2.37.0"
