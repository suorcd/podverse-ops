# Version: 2
# Filename: kustomization.yaml
# Description: Bundles resources and acts as the "Variable" manager for the Database.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 1. Resources to include
# We point to the 'base' directory where the actual Kubernetes objects are defined.
resources:
  - ../../base/db/01-configmap.yaml
  - ../../base/db/03-service.yaml
  - ../../base/db/04-statefulset.yaml

# 2. Namespace
# This ensures all resources in this kustomization are deployed to the alpha namespace.
namespace: podverse-alpha

# Common labels applied to all resources generated by this file.
commonLabels:
  app: podverse-db
  environment: alpha

# 3. Image Variables
# This allows us to update the image version without touching the 'base' files.
images:
  - name: postgres
    newTag: "18.1"