# Version: 2
# The Deployment for the Podverse Workers.
# Handles background tasks (RSS parsing, etc.).
# TODO Review with developer
# FIX: Corrected indentation for envFrom.secretRef.name.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: podverse-workers
  namespace: podverse-alpha
  labels:
    app: podverse-workers
    environment: alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podverse-workers
  template:
    metadata:
      labels:
        app: podverse-workers
        environment: alpha
    spec:
      # Matches 'stop_grace_period: 5m' from Docker Compose
      terminationGracePeriodSeconds: 300
      
      containers:
      - name: workers
        # UPDATE THIS TAG to your desired version
        image: ghcr.io/podverse/podverse-workers/podverse-workers:5.1.10-alpha.0
        
        envFrom:
        - configMapRef:
            name: podverse-workers-config
        - secretRef:
            name: podverse-alpha-workers-opaque
        
        # volumeMounts:
        # # Mount the Firebase JSON key from the Secret
        # - name: firebase-config
        #   mountPath: /opt/config/firebase-key.json
        #   subPath: firebase-key.json
        #   readOnly: true
        
        # Temporary storage for logs if the app writes to disk
        - name: logs
          mountPath: /opt/logs

      # volumes:
      # - name: firebase-config
      #   secret:
      #     secretName: podverse-alpha-workers-firebase-opaque
      
      - name: logs
        emptyDir: {}