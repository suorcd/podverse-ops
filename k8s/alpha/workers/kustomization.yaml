# Version: 1
# Filename: kustomization.yaml
# Description: Bundles the worker deployments and configmap while centralizing the worker image tag.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 03-configmap.yaml
  - consumer-dlq.yaml
  - listener-live.yaml
  - parser-live.yaml
  - parser-normal.yaml
  - parser-ondemand.yaml

namespace: podverse-alpha

images:
  - name: ghcr.io/podverse/podverse-workers/podverse-workers
    newTag: "5.1.13-alpha.1"
