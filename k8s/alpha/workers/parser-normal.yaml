# Version: 3 (Added DB Secret Ref)
# FIX: Corrected indentation for envFrom.secretRef.name entries.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-parser-normal
  namespace: podverse-alpha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-parser-normal
  template:
    metadata:
      labels:
        app: worker-parser-normal
    spec:
      containers:
      - name: worker
        image: ghcr.io/podverse/podverse-workers/podverse-workers:5.1.11-alpha.0
        command: ["npm", "run", "mq_rss_run_parser", "--", "-q", "rss-normal"]
        # TODO: The worker process currently needs to run as root. Address
        # this in the podverse-worker repo so images can run without root.
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - ps aux | grep -q node || exit 1
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - ps aux | grep -q node || exit 1
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        envFrom:
        - configMapRef:
            name: podverse-workers-config
        - secretRef:
            name: podverse-alpha-db-opaque
        - secretRef:
            name: podverse-alpha-mq-opaque
        - secretRef:
            name: podverse-alpha-workers-opaque            
