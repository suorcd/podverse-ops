# Version: 6
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podverse-web
  namespace: podverse-alpha
  labels:
    app: podverse-web
    environment: alpha
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  selector:
    matchLabels:
      app: podverse-web
  template:
    metadata:
      labels:
        app: podverse-web
        environment: alpha
    spec:
      containers:
      - name: web
        image: ghcr.io/podverse/podverse-web/podverse-web:5.1.8-alpha.0
        imagePullPolicy: Always
        # CHANGED: Removed manual command/args. The Dockerfile now handles startup ("npm start").
        env:
        # CHANGED: Force production mode to match the build, overriding the ConfigMap if necessary.
        - name: NODE_ENV
          value: "production"
        envFrom:
        - configMapRef:
            name: podverse-web-config
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 20
          successThreshold: 1
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
          timeoutSeconds: 5
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30