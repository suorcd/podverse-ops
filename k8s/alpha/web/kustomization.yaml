# Version: 1
# Filename: kustomization.yaml
# Description: Bundles the Web frontend resources and centralizes the web image tag.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/web/01-configmap.yaml
  - ../../base/web/02-service.yaml
  - ../../base/web/03-deployment.yaml

namespace: podverse-alpha

commonLabels:
  app: podverse-web
  environment: alpha

images:
  - name: ghcr.io/suorcd/podverse-web-deploy
    newTag: "5.1.13-alpha.0-11"
