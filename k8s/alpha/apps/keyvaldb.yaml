# Version: 3
# Filename: keyvaldb.yaml
# Description: ArgoCD Application definition with explicit Kustomize configuration.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podverse-keyvaldb
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: podverse
  source:
    repoURL: https://github.com/suorcd/podverse-ops.git
    targetRevision: feature/k3s01
    path: k8s/alpha/keyvaldb
    
    # KUSTOMIZE CONFIGURATION
    # ArgoCD detects kustomization.yaml automatically, but this block 
    # allows us to inject overrides at runtime if needed.
    kustomize:
      # Example: Force a common label on all resources generated by this app
      commonLabels:
        argocd.argoproj.io/managed-by: argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: podverse-alpha
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true