# Version: 3
# Application for Workers
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podverse-alpha-workers
  namespace: argocd
  # FINALIZER NOTE:
  # Uncomment the lines below to enable Cascading Deletion (deleting App deletes Pods).
  # If commented out, deleting the App will leave Pods running (Orphaned).
  # finalizers:
  #   - resources-finalizer.argocd.argoproj.io/podverse-alpha-workers
spec:
  project: default
  source:
    repoURL: https://github.com/suorcd/podverse-ops.git
    targetRevision: feature/k3s01
    path: k8s/alpha/workers
  destination:
    server: https://kubernetes.default.svc
    namespace: podverse-alpha
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true