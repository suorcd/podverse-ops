# Source: Jenkinsfile.aux_workers_mq_rss_add_recently_updated_feeds_from_podcast_index
# Schedule: Every 5 minutes
apiVersion: batch/v1
kind: CronJob
metadata:
  name: worker-recent-feeds
  namespace: podverse-alpha
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: worker
            image: ghcr.io/podverse/podverse-workers/podverse-workers:5.1.11-alpha.0
            command: ["npm", "run", "mq_rss_add_recently_updated_feeds_from_podcast_index", "--", "-q", "rss-normal", "-sr", "900"]
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "250m"
            livenessProbe:
              exec:
                command:
                - sh
                - -c
                - ps aux | grep -q node || exit 1
              initialDelaySeconds: 30
              periodSeconds: 60
              failureThreshold: 3
            readinessProbe:
              exec:
                command:
                - sh
                - -c
                - ps aux | grep -q node || exit 1
              initialDelaySeconds: 10
              periodSeconds: 20
              failureThreshold: 3
            envFrom:
            - configMapRef:
                name: podverse-workers-config
            - secretRef:
                name: podverse-alpha-db-opaque
            - secretRef:
                name: podverse-alpha-mq-opaque
            - secretRef:
                name: podverse-alpha-workers-opaque
          #   volumeMounts:
          #   - name: firebase-config
          #     mountPath: /opt/config/firebase-key.json
          #     subPath: firebase-key.json
          #     readOnly: true
          # volumes:
          # - name: firebase-config
          #   secret:
          #     secretName: podverse-workers-firebase-opaque
          restartPolicy: OnFailure
