apiVersion: batch/v1
kind: CronJob
metadata:
  name: worker-dead-feeds-merge
  namespace: podverse-alpha
  labels:
    app: podverse-workers
    task: dead-feeds
spec:
  # Schedule: Run at 2am daily (Change this to match your Jenkins schedule)
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: worker
            image: ghcr.io/podverse/podverse-workers/podverse-workers:5.1.11-alpha.0
            # The command from your Jenkinsfile:
            # npm run podcast_index_dead_feeds_flag_and_merge
            command: ["npm", "run", "podcast_index_dead_feeds_flag_and_merge"]
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "250m"
            livenessProbe:
              exec:
                command:
                - sh
                - -c
                - ps aux | grep -q node || exit 1
              initialDelaySeconds: 30
              periodSeconds: 60
              failureThreshold: 3
            readinessProbe:
              exec:
                command:
                - sh
                - -c
                - ps aux | grep -q node || exit 1
              initialDelaySeconds: 10
              periodSeconds: 20
              failureThreshold: 3

            # Re-use the same env/secrets as the main worker deployment
            envFrom:
            - configMapRef:
                name: podverse-workers-config
            - secretRef:
                name: podverse-alpha-db-opaque
            - secretRef:
                name: podverse-alpha-mq-opaque
            - secretRef:
                name: podverse-alpha-workers-opaque
            volumeMounts:
            - name: logs-volume
              mountPath: /logs
            - name: logs-volume
              mountPath: /opt/logs
            
          #   volumeMounts:
          #   - name: firebase-config
          #     mountPath: /opt/config/firebase-key.json
          #     subPath: firebase-key.json
          #     readOnly: true

          volumes:
          - name: logs-volume
            emptyDir: {}
          # - name: firebase-config
          #   secret:
          #     secretName: podverse-alpha-workers-firebase-opaque
          
          restartPolicy: OnFailure
