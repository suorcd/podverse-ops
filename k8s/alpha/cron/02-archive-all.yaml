# File Version: 4
# Source: Jenkinsfile.aux_workers_archive_all
# Schedule: 6 AM and 6 PM daily
apiVersion: batch/v1
kind: CronJob
metadata:
  name: worker-archive-all
  namespace: podverse-alpha
spec:
  schedule: "0 6,18 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: worker
            image: ghcr.io/podverse/podverse-workers/podverse-workers:5.1.11-alpha.0
            command: ["npm", "run", "archive_all"]
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
            resources:
              requests:
                memory: "512Mi"
                cpu: "100m"
              limits:
                memory: "1Gi"
                cpu: "500m"
            envFrom:
            - configMapRef:
                name: podverse-workers-config
            - secretRef:
                name: podverse-alpha-db-opaque
            - secretRef:
                name: podverse-alpha-mq-opaque
            - secretRef:
                name: podverse-alpha-workers-opaque
            volumeMounts:
            - name: logs-volume
              mountPath: /logs
            - name: logs-volume
              mountPath: /opt/logs
          #   volumeMounts:
          #   - name: firebase-config
          #     mountPath: /opt/config/firebase-key.json
          #     subPath: firebase-key.json
          #     readOnly: true
          volumes:
          - name: logs-volume
            emptyDir: {}
          # - name: firebase-config
          #   secret:
          #     secretName: podverse-workers-firebase-opaque
          restartPolicy: OnFailure