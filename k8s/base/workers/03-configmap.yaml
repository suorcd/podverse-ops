# Version: 1
# Non-sensitive configuration for the Workers.
# Mapped from config/podverse-workers.env.example

apiVersion: v1
kind: ConfigMap
metadata:
  name: podverse-workers-config
  labels:
    app: podverse-workers
    environment: alpha
data:
  # General
  NODE_ENV: "development"
  USER_AGENT: "Podverse/2/Alpha/Worker"
  
  # Logs
  # We will log to stdout for Kubernetes, so we leave LOG_DIR empty or set to console conventions.
  # If the app requires a specific path, the volume mount in the next step will handle it, 
  # but standardizing on stdout is best for K3s/ArgoCD.
  # TODO: Prefer sending logs to stdout so K3s / journald can collect them.
  LOG_LEVEL: "info"
  LOG_TIMER: "true"
  # Keep LOG_DIR empty to force stdout logging in the app if supported.
  LOG_DIR: ""
  
  # Database Networking (Internal K8s Service)
  DB_HOST: "podverse-db"
  DB_PORT: "5432"
  DB_DATABASE: "postgres"
  DB_READ_USERNAME: "read"
  DB_READ_WRITE_USERNAME: "read_write"
  DB_SSL_CONNECTION: "false"

  # RabbitMQ Networking (Internal K8s Service)
  MESSAGE_QUEUE_HOST: "podverse-mq"
  MESSAGE_QUEUE_PORT: "5672"
  MESSAGE_QUEUE_USERNAME: "admin" # Changed from 'user' to match the 'admin' user we set in MQ step. Check your MQ secret.

  # Podcast Index
  PODCAST_INDEX_BASE_URL: "https://api.podcastindex.org/api/1.0"

  ##### Google / Firebase
  #####

  GOOGLE_FIREBASE_NOTIFICATIONS_ENABLED: "" # true or undefined
  GOOGLE_FIREBASE_ADMIN_JSON_KEY_PATH: "" # Set as absolute path

  #####
  ##### Website related
  #####
  ### NOTE: these are for the *public facing* IP addresses,
  ### not the internal Docker service network or private IP addresses.
  ### These are used by some services, e.g. Firebase Cloud Messaging, Unified Push.
  WEB_PROTOCOL: "https"
  WEB_DOMAIN: "alpha-podverse.k.ser.ink"
  WEB_ICON_IMAGE_PATH: "/favicon/web-app-manifest-192x192.png"

  #####
  ##### Default Account Settings
  #####
  # These are used as default values when creating new accounts.
  DEFAULT_ACCOUNT_SETTINGS_LOCALE: "en-US"